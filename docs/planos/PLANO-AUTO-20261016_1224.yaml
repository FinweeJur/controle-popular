### Diretrizes de Execução para o Agente (`opencode-go`)

1. **Isolamento em Worktree:**
   - Criar worktree dedicado: `git worktree add ~/worktrees/controle-popular-task<id> -b auto/task-<id>`.
2. **Commit por Pathspec e Mensagem em Arquivo:**
   - Conferir staging vazio: `git diff --cached --name-only`.
   - Commitar apenas os caminhos afetados: `git commit --only <caminho> -F <arquivo-de-mensagem>`.
   - Mensagem em português sem acentos, com trailer de coautoria obrigatório:
     ```text
     docs: documenta endpoints da API de contratos no OpenAPI e tipos

     Co-Authored-By: GPT-OSS 120B (Medium) <noreply@deepseek.com>
     Co-Authored-By: opencode <noreply@opencode.ai>
     ```
3. **Privacidade e LGPD:**
   - Rodar `python scripts/checar-dado-pessoal-em-dado.py` antes de qualquer commit.
   - Garantir que nenhum token ou variável de ambiente seja incluído na spec ou em fixtures.