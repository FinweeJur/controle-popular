# Preparador de dados das cavas (Fase 1) rodando na VM do Azure.
#
# O QUE FAZ: liga a VM, roda o `preparador-cavas.sh` (baixa janelas de satelite
# e recorta positivos/negativos) e DESLIGA a VM no fim. Concentra tudo numa
# janela diaria para a VM ficar ligada poucos minutos — politica do dono
# (04/10/2026): "preservar as horas, ativar so na hora dos bots".
#
# POR QUE NA VM: o "lado CPU" (fase 1-3) desafoga a RTX 3050 do home-pc, que
# fica para os embeddings e o treino (fase 2+). A imagem de satelite e publica;
# o MODELO continua local.
#
# AUTH: OIDC (sem segredo). Vars AZURE_CLIENT_ID/TENANT_ID/SUBSCRIPTION_ID.
# A VM usa a chave SSH ja provisionada; aqui nao precisamos de SSH porque o
# `az vm run-command` executa dentro do guest agent.
#
# TRANSFERENCIA: os recortes (um tar por rodada) e o manifesto sobem para o
# Azure Blob (conta cpdados4751, container cavas) por um SAS de 3 h de escrita.
# O home-pc baixa quando quiser (ver `scripts/etl/cavas/baixar-recortes-blob.md`).

name: Preparador de cavas (VM Azure)

on:
  schedule:
    # Concentrado: uma vez por dia, logo apos a janela dos demais bots
    # (os ETLs rodam ~08:00-12:00 UTC). GitHub cron e SEMPRE em UTC.
    - cron: "30 12 * * *"
  workflow_dispatch:
    inputs:
      limite:
        description: "Limite por classe (positivos e negativos)"
        required: false
        default: "500"

permissions:
  id-token: write
  contents: read

concurrency:
  group: cavas-preparador
  cancel-in-progress: false

env:
  GRUPO: cp-app
  VM: cp-vm
  # Blob que recebe os recortes (ver a doc de download no home-pc).
  BLOB_ACCOUNT: cpdados4751
  BLOB_CONTAINER: cavas

jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Entrar no Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Ligar a VM
        run: az vm start -g "$GRUPO" -n "$VM"

      # O guest agent demora alguns segundos apos o boot; esperar evita o
      # run-command falhar com "agent not ready".
      - name: Esperar o guest agent
        run: sleep 45

      - name: Garantir a conta e o container de Blob
        run: |
          az storage account show -g "$GRUPO" -n "$BLOB_ACCOUNT" -o none 2>/dev/null \
            || az storage account create -g "$GRUPO" -n "$BLOB_ACCOUNT" -l northcentralus --sku Standard_LRS -o none
          KEY=$(az storage account keys list -g "$GRUPO" -n "$BLOB_ACCOUNT" --query "[0].value" -o tsv)
          az storage container create --account-name "$BLOB_ACCOUNT" -n "$BLOB_CONTAINER" --account-key "$KEY" -o none

      # SAS curto (3 h) so com create/write no container — a VM nao guarda a
      # chave da conta; recebe so este token efemero.
      - name: Gerar SAS de escrita
        id: sas
        run: |
          KEY=$(az storage account keys list -g "$GRUPO" -n "$BLOB_ACCOUNT" --query "[0].value" -o tsv)
          EXP=$(date -u -d '+3 hours' +%Y-%m-%dT%H:%MZ)
          SAS=$(az storage container generate-sas --account-name "$BLOB_ACCOUNT" \
            --name "$BLOB_CONTAINER" --permissions cw --expiry "$EXP" --account-key "$KEY" -o tsv)
          echo "sas=$SAS" >> "$GITHUB_OUTPUT"

      # Dispara DESTACADO de verdade com `systemd-run` (unidade transiente): o
      # `nohup ... &` NAO basta — o agente da VM ainda espera o processo e o
      # run-command fica preso (medido 05/10). O systemd assume o processo e o
      # run-command volta em segundos. O log vai para /var/log/preparador-cavas.log.
      # O SAS vai em base64 para o `&`/`%` nao quebrarem o shell da VM.
      - name: Disparar o preparador (destacado na VM)
        run: |
          LIM="${{ github.event.inputs.limite || '500' }}"
          B64=$(printf '%s' '${{ steps.sas.outputs.sas }}' | base64 -w0)
          CMD="curl -fsSL https://raw.githubusercontent.com/FinweeJur/controle-popular/main/scripts/etl/cavas/preparador-cavas.sh -o /tmp/prep.sh && BLOB_SAS=\$(printf '%s' '$B64' | base64 -d) && systemd-run --collect --unit=preparador-cavas-\$(date +%s) --property=StandardOutput=append:/var/log/preparador-cavas.log --property=StandardError=append:/var/log/preparador-cavas.log --setenv=BLOB_ACCOUNT=$BLOB_ACCOUNT --setenv=BLOB_CONTAINER=$BLOB_CONTAINER --setenv=\"BLOB_SAS=\$BLOB_SAS\" --setenv=LIM_POS=$LIM --setenv=LIM_NEG=$LIM /bin/bash /tmp/prep.sh && echo preparador_iniciado"
          az vm run-command invoke -g "$GRUPO" -n "$VM" \
            --command-id RunShellScript \
            --scripts "$CMD" \
            --query "value[0].message" -o tsv
