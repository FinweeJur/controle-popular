# Certificado do dominio no Azure — SEM build (dono, 06/10/2026).
#
# POR QUE SEPARADO: o `azure-mirror.yml` gasta ~6 min no build da imagem antes
# de chegar no dominio. Quando o que falta e so emitir/renovar o certificado,
# esperar o build abre uma janela sem HTTPS depois da troca de DNS. Este
# workflow faz so a parte do dominio (hostname + TXT de validacao + bind do
# certificado gerenciado), em ~1 minuto.
name: Azure certificado do dominio

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  certificado:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GRUPO: cp-app
      APP: cp-web
    steps:
      - name: Entrar no Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Hostname, TXT de validacao e certificado
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          DOMINIO_EXTRA="${{ vars.AZURE_CUSTOM_DOMAIN || 'www.controlepopular.com.br' }}"
          ZONA_EXTRA="${DOMINIO_EXTRA#*.}"
          echo "dominio: $DOMINIO_EXTRA (zona $ZONA_EXTRA)"

          # Ajuda do CLI: a sintaxe de `env certificate create` muda entre
          # versões (`--environment` foi recusado em 07/10) e é ela que decide
          # como pedir o certificado com validação TXT.
          echo "=== ajuda: env certificate create ==="
          az containerapp env certificate create --help 2>&1 | head -45 || true
          echo "=== ajuda: env certificate list ==="
          az containerapp env certificate list --help 2>&1 | head -25 || true

          echo "=== estado ANTES ==="
          az containerapp hostname list -g "$GRUPO" -n "$APP" -o table || true

          az containerapp hostname add -g "$GRUPO" -n "$APP" --hostname "$DOMINIO_EXTRA" -o none 2>/dev/null || true

          # O token de validação vive em `properties.customDomains[]`. Ler por
          # jq (e não por JMESPath) porque o campo varia de forma entre versões
          # do CLI — foi o que devolveu vazio em 06/10 e deixou o bind sem TXT.
          CADASTRO=$(az containerapp show -g "$GRUPO" -n "$APP" \
            --query "properties.customDomains" -o json 2>/dev/null || echo '[]')
          echo "=== customDomains ==="
          echo "$CADASTRO" | jq -r '.[] | "nome=" + .name + " binding=" + (.bindingType // "-") + " token=" + (.validationToken // "-")'
          TOKEN=$(echo "$CADASTRO" | jq -r --arg d "$DOMINIO_EXTRA" '.[] | select(.name==$d) | .validationToken // empty')
          if [ -z "$TOKEN" ]; then
            # Fallback: o proprio erro do bind revela o valor esperado
            # ("A TXT record pointing from asuid.<host> to <TOKEN>").
            TOKEN=$(az containerapp hostname bind -g "$GRUPO" -n "$APP" --hostname "$DOMINIO_EXTRA" \
              --environment cp-env --validation-method TXT -o none 2>&1 \
              | grep -oE 'to [A-Fa-f0-9]{8,}' | awk '{print $2}' | head -1 || true)
          fi
          echo "token de validacao: ${TOKEN:-(nao encontrado)}"
          echo "TXT a publicar: asuid.$DOMINIO_EXTRA = ${TOKEN:-?}"

          if [ -n "$TOKEN" ] && [ -n "$CF" ]; then
            api="https://api.cloudflare.com/client/v4"
            ZID=$(curl -s -H "Authorization: Bearer $CF" "$api/zones?name=$ZONA_EXTRA" | jq -r '.result[0].id // empty')
            if [ -n "$ZID" ]; then
              NOME_TXT="asuid.$DOMINIO_EXTRA"
              RID=$(curl -s -H "Authorization: Bearer $CF" "$api/zones/$ZID/dns_records?name=$NOME_TXT" | jq -r '.result[0].id // empty')
              CORPO="{\"type\":\"TXT\",\"name\":\"$NOME_TXT\",\"content\":\"$TOKEN\",\"ttl\":120}"
              if [ -n "$RID" ]; then
                RESP=$(curl -s -X PATCH -H "Authorization: Bearer $CF" -H "Content-Type: application/json" \
                  "$api/zones/$ZID/dns_records/$RID" --data "$CORPO")
              else
                RESP=$(curl -s -X POST -H "Authorization: Bearer $CF" -H "Content-Type: application/json" \
                  "$api/zones/$ZID/dns_records" --data "$CORPO")
              fi
              echo "Cloudflare respondeu: $(echo "$RESP" | jq -r '.success|tostring') $(echo "$RESP" | jq -r '.errors[0].message // ""')"
            else
              echo "zona $ZONA_EXTRA nao encontrada na Cloudflare"
            fi
          fi

          # CNAME primeiro: e o caminho que funciona quando o DNS ja aponta para
          # este app (o caso depois da troca). TXT como plano B — depende do
          # registro `asuid` publicado, que o token do repo NAO consegue criar
          # (erro 10405), entao ali o dono publica pelo painel.
          # Sintaxe medida em 07/10 (`env certificate create --help`):
          #   -n/--name          = NOME DO AMBIENTE (não do certificado!)
          #   --certificate-name = nome do certificado gerenciado
          #   --validation-method TXT = valida pelo `asuid.<host>` (já publicado)
          # A validação por CNAME NÃO funciona com o registro proxied da
          # Cloudflare: o Azure não enxerga a cadeia e o certificado fica
          # `Pending` para sempre (medido: 10 min sem sair de Pending).
          NOME_CERT="cert-www-controlepopular-com-br"

          echo "=== certificados no ambiente (antes) ==="
          az containerapp env certificate list -g "$GRUPO" -n cp-env -o table || true

          # NÃO recriar quando já existe certificado para o host: recriar GERA UM
          # TOKEN NOVO e invalida o TXT que o dono acabou de publicar — foi o que
          # travou em 07/10 (o token virou `_urwtg...` e o TXT ainda tinha o
          # antigo). Só cria quando não há nenhum; existindo, apenas espera e
          # vincula.
          EXISTENTES=$(az containerapp env certificate list -g "$GRUPO" -n cp-env \
            --query "[?properties.subjectName=='$DOMINIO_EXTRA'].name" -o tsv 2>/dev/null || true)
          if [ -z "$EXISTENTES" ]; then
            echo "=== nenhum certificado para o host: criando por TXT ($NOME_CERT) ==="
            az containerapp env certificate create -g "$GRUPO" -n cp-env \
              --certificate-name "$NOME_CERT" --hostname "$DOMINIO_EXTRA" \
              --validation-method TXT \
              || echo "AVISO: create devolveu erro (ver a mensagem acima)."
          else
            echo "=== certificado ja existe para o host ($EXISTENTES) — nao recrio ==="
            echo "    token esperado agora:"
            az containerapp env certificate list -g "$GRUPO" -n cp-env \
              --query "[?properties.subjectName=='$DOMINIO_EXTRA'].properties.validationToken" -o tsv || true
          fi

          echo "=== aguardando o certificado ficar pronto ==="
          for i in $(seq 1 15); do
            ESTADO=$(az containerapp env certificate list -g "$GRUPO" -n cp-env \
              --query "[?properties.subjectName=='$DOMINIO_EXTRA'].properties.provisioningState | [0]" \
              -o tsv 2>/dev/null || true)
            NOMES=$(az containerapp env certificate list -g "$GRUPO" -n cp-env \
              --query "[?properties.subjectName=='$DOMINIO_EXTRA'].name" -o tsv 2>/dev/null || true)
            echo "  tentativa $i/15: estado=${ESTADO:-?} nome=${NOMES:-?}"
            [ "$ESTADO" = "Succeeded" ] && break
            sleep 20
          done

          echo "=== vinculando o certificado ao app ==="
          # Certificado em `Failed` nao serve para bind e ainda confunde a
          # escolha: apaga antes, para o caminho por TXT criar/validar um novo
          # com o token certo.
          FALHOS=$(az containerapp env certificate list -g "$GRUPO" -n cp-env \
            --query "[?properties.subjectName=='$DOMINIO_EXTRA' && properties.provisioningState=='Failed'].name" \
            -o tsv 2>/dev/null || true)
          for c in $FALHOS; do
            echo "  removendo certificado falho $c"
            az containerapp env certificate delete -g "$GRUPO" -n cp-env --certificate "$c" -y -o none \
              || echo "  (nao consegui remover $c)"
          done

          ALVO_CERT=$(az containerapp env certificate list -g "$GRUPO" -n cp-env \
            --query "[?properties.subjectName=='$DOMINIO_EXTRA' && properties.provisioningState=='Succeeded'].name | [0]" \
            -o tsv 2>/dev/null || true)
          if [ -n "$ALVO_CERT" ]; then
            az containerapp hostname bind -g "$GRUPO" -n "$APP" -e cp-env \
              --hostname "$DOMINIO_EXTRA" --certificate "$ALVO_CERT" -o none \
              || echo "AVISO: o bind com $ALVO_CERT nao concluiu."
          else
            SAIDA_BIND=$(az containerapp hostname bind -g "$GRUPO" -n "$APP" -e cp-env \
              --hostname "$DOMINIO_EXTRA" --validation-method TXT -o none 2>&1) || true
            echo "$SAIDA_BIND"
            # A mensagem do bind é AUTORIDADE sobre o token: ela diz exatamente
            # qual TXT o Azure espera. Em 07/10 o token do certificado avulso
            # (`_urwtg...`) era DIFERENTE do token do hostname (`06C48CD2...`)
            # e seguir o primeiro travou o processo — o que vale é este.
            ESPERADO=$(echo "$SAIDA_BIND" | grep -oE 'to [A-Fa-f0-9]{16,}' | awk '{print $2}' | head -1 || true)
            if [ -n "$ESPERADO" ]; then
              echo "### TXT ESPERADO PELO AZURE: asuid.$DOMINIO_EXTRA = $ESPERADO"
            fi
          fi

          echo "=== estado DEPOIS ==="
          az containerapp hostname list -g "$GRUPO" -n "$APP" -o table || true
          az containerapp show -g "$GRUPO" -n "$APP" \
            --query "properties.customDomains[?name=='$DOMINIO_EXTRA'].{nome:name,laco:bindingType,cert:certificateId}" \
            -o json || true
