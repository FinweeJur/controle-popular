name: ETL judiciario

on:
  schedule:
    - cron: "0 9 * * *"   # diário — indicações do ano corrente + vacância
    - cron: "0 10 * * 1"  # semanal — backfill de anos anteriores (raro mudarem)
  push:
    paths:
      - 'etl/judiciario/**'
      - '.github/workflows/etl-judiciario.yml'
  workflow_dispatch:
    inputs:
      modulo:
        description: "Módulo específico (ex.: etl.senado.indicacoes --ano 2026). Vazio = rotina diária."
        required: false

jobs:
  etl:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etl/judiciario
    env:
      # Desde a Fase 3 da migração Cloudflare/Neon o app lê só do Neon — o
      # ETL escrevia no Supabase (secrets antigos) e sincronizava dado que
      # ninguém mais lia. Mesma variável que apps/web/.env.local usa.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl/judiciario/requirements.txt
      - run: pip install -r requirements.txt

      # Sempre roda: barato, não depende de rede nem de banco. Se o
      # extrator de cota regredir, é melhor descobrir aqui do que gravar
      # dispositivo inventado em produção — foi exatamente esse tipo de
      # bug (inciso espúrio no STF) que a F2 ao vivo achou em 2026-07-24.
      - name: Regressão do extrator de cota
        run: python -m etl.cota --testar

      - name: Regressão da régua (vacância + presidente_em)
        run: python -m etl.vacancia --testar

      - name: Módulo específico
        if: inputs.modulo != ''
        run: python -m ${{ inputs.modulo }}

      - name: Rotina diária — indicações do ano corrente
        if: inputs.modulo == '' && github.event.schedule != '0 10 * * 1'
        run: python -m etl.senado.indicacoes --ano $(date +%Y)

      # Anos anteriores raramente mudam (só se uma Mensagem antiga for
      # reprocessada/corrigida pelo Senado); rodar semanal é suficiente e
      # evita 24 requisições extras todo dia à toa.
      - name: Rotina semanal — backfill 2003 até o ano corrente
        if: inputs.modulo == '' && github.event.schedule == '0 10 * * 1'
        run: |
          for ano in $(seq 2003 $(date +%Y)); do
            python -m etl.senado.indicacoes --ano $ano
            sleep 1
          done
