name: Guara Cloud CI & Deploy

# Esteira de testes automatizados e deploy da Guara Cloud (PaaS brasileira).
#
# Em cada push e pull_request para `main` (sempre):
# 1. Testes unitários (vitest na pasta apps/web)
# 2. Typecheck (tsc --noEmit). O build standalone do Guara pula o tsc embutido
#    do `next build` para não gastar cota (ver apps/web/next.config.ts); este
#    passo é a rede que substitui aquela checagem.
# 3. Varredura estrita de privacidade (scripts/checar-dado-pessoal-em-dado.py)
#
# Deploy NÃO roda em push (política do dono, OPERACAO.md §0, 19/09/2026):
# um build gasta ~17 min dos 250 min do ciclo Starter, então o deploy é
# manual, no máximo a cada ~5 dias. Dispare pelo botão "Run workflow"
# (workflow_dispatch) ou pela CLI (OPERACAO.md §3). O push empilha commits;
# o último é o que vai.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: guara-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testar:
    name: Testes e Validação de Privacidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes unitários (apps/web)
        run: npm run test:lib -w @cp/web

      - name: Typecheck (apps/web)
        run: npm run typecheck -w @cp/web

      - name: Validar privacidade e ausência de CPF em dados ingeridos
        run: python scripts/checar-dado-pessoal-em-dado.py

  deploy:
    name: Disparar Deploy Guara Cloud (manual)
    needs: testar
    # Só em disparo manual: em push o deploy queima cota (OPERACAO.md §0).
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar Deploy via Guara CLI
        env:
          GUARA_API_KEY: ${{ secrets.GUARA_API_KEY }}
          # Slug do projeto (guara projects list). Pode ser sobrescrito pela
          # variável de repositório GUARA_PROJECT se o projeto mudar de nome.
          GUARA_PROJECT: ${{ vars.GUARA_PROJECT }}
        run: |
          if [ -n "$GUARA_API_KEY" ]; then
            echo "Instalando Guara CLI..."
            npm install -g @guaracloud/cli
            # O CLI 0.3.0 não acha o projeto sozinho no runner (sem guara link):
            # sem --project ele falha com "No project specified" (medido 28/09).
            PROJECT="${GUARA_PROJECT:-controle-popular}"
            echo "Disparando deploy do projeto $PROJECT, branch main..."
            guara deploy --project "$PROJECT" --branch main --yes
            echo "Deploy disparado com sucesso."
          else
            echo "GUARA_API_KEY não configurado nos secrets do repositório."
            echo "Configure: gh secret set GUARA_API_KEY"
          fi
