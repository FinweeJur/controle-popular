# Publica a PÁGINA DE STATUS no GitHub Pages — HTML estático puro.
#
# POR QUE SÓ A PÁGINA DE STATUS (decisão do dono, 06/10/2026) ──────────────
# O workflow antigo tentava exportar o PORTAL INTEIRO (`output: export`). Isso
# está quebrado no Next 16 e o alvo foi aposentado em 22/08 — está escrito em
# `apps/web/app/[municipio]/layout.tsx`: o runtime quer `dynamicParams = true`,
# o export quer `false`, e a MESMA rota serve os dois. Reviver o export inteiro
# é projeto à parte.
#
# O que importa aqui é INDEPENDÊNCIA: um alarme que continua respondendo quando
# o portal cai. Em 06/10/2026 a Guara parou e NÃO havia alarme — a falha só
# apareceu porque um agente mediu. Esta página resolve isso.
#
# O QUE ESTE WORKFLOW FAZ: publica a pasta `status-pages/` como site estático
# no GitHub Pages (outro provedor). A página mede, no NAVEGADOR de quem abre, os
# três servidores do portal (Guara, home-pc e Azure). Sem build, sem banco, sem
# segredo: o deploy sai em ~1 minuto.
#
# ALVO ALTERNATIVO, NÃO SUBSTITUTO: o portal em si segue no Cloudflare Workers
# (`rebuild.yml`) e na Guara. Aqui mora só o painel de status.
#
# Nota de Termos (segue valendo para qualquer uso do Pages): a AUP §10 do GitHub
# desaconselha foco primário em publicidade. Uma página de status de serviço não
# tem essa natureza.
name: Status no GitHub Pages (estático)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  # OIDC: `deploy-pages@v4` troca este token pela credencial de publicação.
  # Sem ele o deploy falha com erro de permissão, não de configuração.
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Prepara a publicação no Pages (base path do projeto). A página é
      # auto-contida e usa URLs ABSOLUTAS dos servidores, então não depende
      # disto — fica pelo protocolo do `deploy-pages`.
      - uses: actions/configure-pages@v5

      # O artefato é só a pasta `status-pages/` (`index.html` + `status/`).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: status-pages

      - id: deployment
        uses: actions/deploy-pages@v4
