name: ETL betim

# Cron matrix per plan §5.4. All times UTC.
#   0 8 * * *        daily     — PNCP (contratos, licitações), weather
#   0 9 * * 1         weekly    — infodengue, servidores, CNPJ enrich, grupos
#                                 econômicos, Câmara (vereadores/proposições/
#                                 verbas/diárias/comissões), convênios federais,
#                                 CEIS/CNEP, benefícios sociais, crimes (Sejusp),
#                                 ANP, motor de alertas (+ embeddings/newsletter
#                                 once those modules exist)
#   0 10 1 * *        monthly   — Base dos Dados Track A, agropecuária (IBGE
#                                 PAM/PPM), frota de veículos (DENATRAN),
#                                 caixa disponível/balanço, legislação
#                                 ambiental das 5 fontes — ALMG/SEMAD/SIAM
#                                 (estaduais) e MMA/CNDH (nacionais)
#                                 (+ almg emendas once built)
#   0 11 1 1,4,7,10 * quarterly — IBGE malha/hierarquia geográfica, feriados
#                                 nacionais (BrasilAPI), IDH/pobreza (PNUD/ADH,
#                                 só muda em ano de Censo mas sem cadência
#                                 "por década" própria), datajud (once built)
#
# 2026-07-23: 8 módulos que já existiam no repo nunca tinham sido adicionados
# aqui (Câmara inteira, convênios, CEIS/CNEP, benefícios sociais, crimes,
# ANP) — o site rodava com dado sincronizado manualmente, não pelo cron.
# Corrigido nesta revisão; alguns novos passos (comissões, agropecuária)
# usam `continue-on-error: true` porque dependem de migrations ainda não
# rodadas pelo usuário (0015/0016) — não devem travar o resto do workflow.
# Também adicionados nesta revisão: frota de veículos (DENATRAN), IDH e
# taxa de pobreza (PNUD/Atlas do Desenvolvimento Humano) — destravam os 3
# cards "em breve" que sobravam na Home.
#
# 2026-08-09: mais 5 módulos que já existiam no repo e nunca tinham sido
# adicionados aqui — votação nominal da Câmara (+ o elo com proposições e a
# classificação de baixo teor, que dependem de proposições já coletadas),
# comércios essenciais (OSM) e a auditoria do Rio Paraopeba (FGV). Os 5
# entram SÓ no `workflow_dispatch` por enquanto (sem `|| github.event.schedule
# == ...`), de propósito: a Neon está em HTTP 402 (cota de egress estourada)
# até 2026-09-01, e a causa raiz foi carga automática demais, não de menos —
# não faz sentido destravar cron novo no meio do bloqueio. `votacoes_betim`
# tem um motivo a mais: RE-VARRE as ~929 matérias da legislatura inteira a
# cada rodada (sem incremental, ver a docstring do módulo) — rodar isso toda
# semana sem medir primeiro quanto tempo/tráfego custa seria repetir o erro
# que causou o bloqueio. Ativar depois de 01/09: mover cada passo pro mesmo
# `if` dos vizinhos (semanal pros 4 primeiros, mensal pro FGV), depois de
# rodar uma vez manual e medir.
#
# `etl.apis.anm_cfem` (royalties CFEM/ANM) NÃO entra aqui de propósito: Betim
# não tem mineração relevante (ver a migration 0044) — quem precisa dele é
# Araçuaí/Itinga/Diamantina, já agendados em `etl-mg-interior.yml`.
# `etl.apis.brasilapi` também fica de fora: a própria docstring do módulo
# proíbe uso em varredura/cron (termos da BrasilAPI vetam "crawling
# automatizado") — é enriquecimento pontual, manual, com teto.
#
# workflow_dispatch runs every step below regardless of schedule, for manual
# backfills/testing.
on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 9 * * 1'
    - cron: '0 10 1 * *'
    - cron: '0 11 1 1,4,7,10 *'
  workflow_dispatch:

env:
  ID_MUNICIPIO: '3106705'
  # Desde a Fase 3 da migração Cloudflare/Neon o app lê só do Neon — o ETL
  # escrevia no Supabase (secrets antigos) e sincronizava dado que ninguém
  # mais lia. Mesma variável que apps/web/.env.local usa.
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  TRANSPARENCIA_API_KEY: ${{ secrets.TRANSPARENCIA_API_KEY }}
  AI_API_KEY: ${{ secrets.AI_API_KEY }}
  GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp-service-account.json

jobs:
  etl:
    runs-on: ubuntu-latest
    # ─── DESLIGADO POR AGENDAMENTO EM 2026-08-10 ────────────────────────
    # O banco saiu da Neon e é o Postgres da máquina de build, que o runner
    # do GitHub não alcança. Agendado, este job acordava todo dia e gravava
    # em lugar nenhum — o pior tipo de tarefa, a que parece viva.
    #
    # O `schedule:` acima FICA, e não é resíduo: `scripts/rotina-local.mts`
    # lê exatamente estes crons para saber o que entra na rodada de cada
    # dia. A cadência continua declarada aqui; só a execução mudou de casa.
    # Apagar os crons quebraria a rotina local em silêncio.
    #
    # `workflow_dispatch` segue valendo, para quando o alvo voltar a ser um
    # banco alcançável pelo CI.
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: etl/betim
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # CAMINHO RELATIVO AO `working-directory: etl/betim` acima. Estava
      # `etl/requirements.txt`, que resolve para `etl/betim/etl/requirements.txt`
      # e nao existe: o job falhou 16 de 16 vezes entre 01/08 e 07/08/2026,
      # sempre neste passo. Como morre antes de tocar o banco, nao gastou
      # egress do Neon — mas o ETL de Betim simplesmente nao rodou durante
      # uma semana, e o unico sintoma era dado velho no site.
      #
      # As irmas ja estavam certas, inclusive a `etl-cidades-novas.yml`, que
      # usa este MESMO working-directory: todas fazem `-r requirements.txt`.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser (Câmara scrapers)
        run: playwright install --with-deps chromium

      - name: Write GCP service account credentials
        # Only consumed by the Base dos Dados (BigQuery) steps below; harmless
        # to write on every run. Empty until the GCP_SA_JSON secret is set (F0).
        run: echo '${{ secrets.GCP_SA_JSON }}' > "$GOOGLE_APPLICATION_CREDENTIALS"

      # Sem `if:` de propósito, como a regressão do extrator de normas em
      # `etl-congresso.yml`: roda em TODA invocação, antes de qualquer coletor
      # escrever. É teste de função pura, não custa rede nem banco.
      #
      # Guarda a `redigir_documentos`, que passou a rodar na ingestão em
      # 15/08/2026 depois que a ementa oficial da Portaria IBAMA 2080/2012
      # levou o CPF de uma pessoa nomeada para dentro do repositório PÚBLICO.
      # Os casos cobrem os dois lados — o que TEM de sair e o que NÃO PODE ser
      # tocado (número de processo na mesma frase, CNPJ, código IBGE, número
      # de norma) —, porque a primeira versão do guarda de CPF deste repo
      # passava verde com CPF real dentro, e ninguém notou até alguém
      # sabotá-la de propósito.
      - name: Regressão da redação de dado pessoal
        run: python -m etl.apis._legislacao_ambiental --testar

      # ── Daily (0 8 * * *): PNCP + weather ─────────────────────────────
      - name: 'PNCP contratos (daily)'
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 8 * * *'
        run: python -m etl.pncp.contratos --id-municipio $ID_MUNICIPIO

      - name: 'PNCP licitações (daily)'
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 8 * * *'
        run: python -m etl.pncp.licitacoes --id-municipio $ID_MUNICIPIO

      - name: 'Open-Meteo weather (daily)'
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 8 * * *'
        run: python -m etl.apis.openmeteo --id-municipio $ID_MUNICIPIO

      # ── Weekly (0 9 * * 1): InfoDengue + CNPJ enrichment ──────────────
      - name: 'InfoDengue (weekly)'
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 9 * * 1'
        run: python -m etl.apis.infodengue --id-municipio $ID_MUNICIPIO

      - name: 'Prefeitura — servidores (weekly)'
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 9 * * 1'
        run: python -m etl.prefeitura.b3106705 --id-municipio $ID_MUNICIPIO

      - name: 'Prefeitura — obras públicas (weekly)'
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 9 * * 1'
        run: python -m etl.prefeitura.obras --id-municipio $ID_MUNICIPIO

      - name: 'Prefeitura — legislação (leis/decretos, weekly)'
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 9 * * 1'
        run: python -m etl.prefeitura.legislacao --id-municipio $ID_MUNICIPIO

      - name: 'CNPJ enrichment — fornecedores/sócios (weekly)'
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 9 * * 1'
        run: python -m etl.bd.cnpj --id-municipio $ID_MUNICIPIO

      - name: 'Grupos econômicos (weekly)'
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 9 * * 1'
        run: python -m etl.grupos --id-municipio $ID_MUNICIPIO

      - name: 'Câmara — vereadores/proposições/mesa diretora (weekly)'
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 9 * * 1'
        run: python -m etl.camaras.betim --id-municipio $ID_MUNICIPIO

      - name: 'Câmara — verbas indenizatórias (weekly)'
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 9 * * 1'
        run: python -m etl.camaras.verbas --id-municipio $ID_MUNICIPIO

      - name: 'Câmara — diárias de viagem (weekly)'
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 9 * * 1'
        run: python -m etl.camaras.diarias --id-municipio $ID_MUNICIPIO

      - name: 'Câmara — comissões (weekly)'
        # Depende da migration 0015_comissoes.sql — falha graciosamente (tabela
        # ausente) até o usuário rodar; não bloqueia os passos seguintes.
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 9 * * 1'
        continue-on-error: true
        run: python -m etl.camaras.comissoes --id-municipio $ID_MUNICIPIO

      # ── Passos novos 2026-08-09, só workflow_dispatch (ver o comentário no
      #    topo do arquivo) ────────────────────────────────────────────────
      - name: 'Câmara — votação nominal (manual só, ver nota 2026-08-09)'
        if: github.event_name == 'workflow_dispatch'
        run: python -m etl.camaras.votacoes_betim --id-municipio $ID_MUNICIPIO

      - name: 'Câmara — ligar votações às proposições (manual só, ver nota 2026-08-09)'
        # É REPARADOR (só lê `materia` e escreve `proposicao_id`, não fala com
        # fonte externa) — roda depois de câmara + votação nominal acima.
        if: github.event_name == 'workflow_dispatch'
        run: python -m etl.camaras.ligar_votacoes --id-municipio $ID_MUNICIPIO

      - name: 'Proposições — baixo teor normativo (manual só, ver nota 2026-08-09)'
        # Idempotente (reclassifica a partir da ementa já no banco); depende
        # de `camaras.betim` já ter rodado no mesmo job, acima.
        if: github.event_name == 'workflow_dispatch'
        run: python -m etl.teor_backfill --id-municipio $ID_MUNICIPIO

      - name: 'Comércios essenciais — supermercados e farmácias (OSM) (manual só, ver nota 2026-08-09)'
        if: github.event_name == 'workflow_dispatch'
        run: python -m etl.apis.osm_comercios --id-municipio $ID_MUNICIPIO

      - name: 'Convênios federais / emendas (weekly)'
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 9 * * 1'
        run: python -m etl.apis.transparencia_gov --id-municipio $ID_MUNICIPIO

      - name: 'Fornecedores sancionados CEIS/CNEP (weekly)'
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 9 * * 1'
        run: python -m etl.apis.ceis_cnep --id-municipio $ID_MUNICIPIO

      - name: 'Benefícios sociais — Bolsa Família/BPC (weekly)'
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 9 * * 1'
        run: python -m etl.apis.beneficios_sociais --id-municipio $ID_MUNICIPIO

      - name: 'Crimes violentos (Sejusp-MG) (weekly)'
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 9 * * 1'
        run: python -m etl.apis.crimes_mg --id-municipio $ID_MUNICIPIO

      - name: 'Postos de combustível (ANP) (weekly)'
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 9 * * 1'
        run: python -m etl.apis.anp --id-municipio $ID_MUNICIPIO

      - name: 'Motor de alertas (weekly)'
        # Roda por último no bloco semanal -- depende de fornecedores/CEIS já
        # atualizados acima pra Regra 5 funcionar com dado fresco.
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 9 * * 1'
        run: python -m etl.alertas --id-municipio $ID_MUNICIPIO

      # TODO once embeddings regeneration / newsletter digest scripts exist: weekly steps here

      # ── Monthly (0 10 1 * *): Base dos Dados Track A ──────────────────
      - name: 'BD SICONFI — despesas/receitas (monthly)'
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 1 * *'
        run: python -m etl.bd.siconfi --id-municipio $ID_MUNICIPIO

      - name: 'BD IBGE — população/PIB (monthly)'
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 1 * *'
        run: python -m etl.bd.ibge --id-municipio $ID_MUNICIPIO

      - name: 'BD INEP — IDEB/censo escolar (monthly)'
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 1 * *'
        run: python -m etl.bd.inep --id-municipio $ID_MUNICIPIO

      - name: 'BD CNES — estabelecimentos de saúde (monthly)'
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 1 * *'
        run: python -m etl.bd.cnes --id-municipio $ID_MUNICIPIO

      - name: 'BD SIH/SIM — internações/mortalidade (monthly)'
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 1 * *'
        run: python -m etl.bd.sih_sim --id-municipio $ID_MUNICIPIO

      - name: 'BD SNIS — água/esgoto/resíduos (monthly)'
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 1 * *'
        run: python -m etl.bd.snis --id-municipio $ID_MUNICIPIO

      - name: 'BD RAIS/CAGED — trabalho (monthly)'
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 1 * *'
        run: python -m etl.bd.trabalho --id-municipio $ID_MUNICIPIO

      - name: 'BD IBGE PAM/PPM — produção agropecuária (monthly)'
        # Depende da migration 0016_producao_agropecuaria.sql — falha
        # graciosamente até o usuário rodar; não bloqueia os passos seguintes.
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 1 * *'
        continue-on-error: true
        run: python -m etl.bd.agropecuaria --id-municipio $ID_MUNICIPIO

      - name: 'BD SICONFI — caixa disponível / balanço patrimonial (monthly)'
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 1 * *'
        run: python -m etl.bd.balanco --id-municipio $ID_MUNICIPIO

      - name: 'BD DENATRAN — frota de veículos (monthly)'
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 1 * *'
        run: python -m etl.bd.frota --id-municipio $ID_MUNICIPIO

      # ── Legislação ambiental: as 5 fontes de `ambiental_legislacao` ───
      #
      # DECLARADAS EM 2026-08-15, e o motivo importa mais que a cadência: até
      # hoje NENHUMA das cinco estava em workflow nenhum. O corpus inteiro
      # (15.318 normas) era carregado à mão na máquina de build, o que quer
      # dizer que ele congelava no dia da última carga manual e ninguém era
      # avisado — a tela seguiria mostrando um número correto na forma e
      # velho no conteúdo, que é o pior jeito de estar errado.
      #
      # Descoberto ao mesclar o PC externo: ele trouxe schema, coletor e tela
      # da legislação FEDERAL, mas não tem Postgres, então as 8.940 normas
      # nunca chegaram a banco nenhum. A tela ia ao ar prometendo MMA, Ibama,
      # ICMBio e Conama com filtro por esfera, e imprimindo "0 normas
      # federais" logo abaixo.
      #
      # MENSAL, e não diário/semanal, é a cadência da própria fonte: o recurso
      # do MMA é um CSV anual ('Legislação Ambiental Brasileira_2025', criado
      # em 23/09/2025) e a página do CNDH no Decidim estava, ao declarar isto,
      # atualizada em 29/01/2026. Lei não muda de manhã pra tarde; bater
      # diariamente em API de governo por dado que muda no mês seria custo sem
      # informação.
      #
      # `continue-on-error` em todos: ALMG e SEMAD paginam com pausa de >=1s
      # exigida pela fonte, então são os passos mais demorados do mês e os
      # mais sujeitos a timeout. Um deles cair não pode derrubar os outros
      # quatro nem o build do dia — a rotina local só recusa publicar se
      # TODOS os passos de ETL falharem (ver docs/rotina-local.md).
      - name: 'Legislação ambiental ALMG — leis estaduais (monthly)'
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 1 * *'
        continue-on-error: true
        run: python -m etl.apis.legislacao_almg

      - name: 'Legislação ambiental SEMAD — deliberações/portarias (monthly)'
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 1 * *'
        continue-on-error: true
        run: python -m etl.apis.legislacao_semad

      - name: 'Legislação ambiental SIAM — atos do sistema estadual (monthly)'
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 1 * *'
        continue-on-error: true
        run: python -m etl.apis.legislacao_siam

      - name: 'Legislação ambiental MMA/Conama — federal (monthly)'
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 1 * *'
        continue-on-error: true
        run: python -m etl.apis.legislacao_mma

      - name: 'CNDH — resoluções e recomendações (monthly)'
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 1 * *'
        continue-on-error: true
        run: python -m etl.apis.legislacao_cndh

      # DEPOIS dos cinco acima, e a ordem é o passo: este módulo não bate em
      # fonte externa nenhuma — lê `ementa`/`indexacao` das linhas que já estão
      # na tabela e deriva `temas`. Rodar antes dos coletores classificaria o
      # corpus do mês passado e deixaria o novo sem tema, que é exatamente o
      # estado encontrado em 15/08/2026: as 8.940 normas nacionais entraram com
      # 0% de tema contra 31,5% das estaduais, e a tela publicava só a média
      # das duas (13,1%) — verdadeira e, sozinha, enganosa.
      #
      # É determinístico e idempotente (mesma entrada, mesma saída), então
      # rodar de novo sobre linha já classificada não duplica nem estraga.
      - name: 'Classificar temas ambientais (monthly, depois dos coletores)'
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 1 * *'
        continue-on-error: true
        run: python -m etl.apis.classificar_temas_ambientais

      - name: 'Auditoria Rio Paraopeba — FGV (manual só, ver nota 2026-08-09)'
        # Planilha mensal (geral-MM-AAAA.xlsx); mensal é a cadência certa da
        # própria fonte, não um teto arbitrário. Só workflow_dispatch por
        # enquanto — mesmo motivo dos passos de câmara acima.
        if: github.event_name == 'workflow_dispatch'
        run: python -m etl.apis.fgv_paraopeba --id-municipio $ID_MUNICIPIO

      # TODO once etl.apis.almg exists (ALMG state amendments): monthly step here
      # NOTE: etl.bd.tse runs once per electoral term, not on a recurring cron —
      #       trigger manually via workflow_dispatch + a dedicated invocation when needed.

      # ── Quarterly (0 11 1 1,4,7,10 *): Datajud + IBGE geo ─────────────
      - name: 'IBGE — malha geográfica/hierarquia (quarterly)'
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 11 1 1,4,7,10 *'
        run: python -m etl.apis.ibge --id-municipio $ID_MUNICIPIO

      - name: 'BrasilAPI — feriados nacionais (quarterly)'
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 11 1 1,4,7,10 *'
        run: python -m etl.apis.feriados

      - name: 'BD PNUD/ADH — IDH e taxa de pobreza (quarterly)'
        # Trimestral por segurança, mas na prática só muda em ano de Censo
        # (1991/2000/2010 até agora) -- não há um cadenciamento "por
        # década" no workflow, então roda no bloco de menor frequência
        # existente sem custo real (query pequena).
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 11 1 1,4,7,10 *'
        run: python -m etl.bd.idh_pobreza --id-municipio $ID_MUNICIPIO

      - name: 'Nota de Transparência (PNTP/ATRICON) (quarterly)'
        # Depende da migration 0018_nota_transparencia.sql — falha
        # graciosamente até o usuário rodar. Trimestral (não mensal) porque a
        # ATRICON só atualiza o ZIP algumas vezes por ano -- baixar 338MB
        # todo mês pra um dado que raramente muda seria desperdício.
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 11 1 1,4,7,10 *'
        continue-on-error: true
        run: python -m etl.apis.pntp --id-municipio $ID_MUNICIPIO

      # TODO once etl.apis.datajud exists (CNJ process lookups for councilors): quarterly step here
