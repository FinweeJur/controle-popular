# Espelho do portal no Azure Container Apps (oferta GitHub Student Pack).
#
# O QUE FAZ: constroi a imagem Docker do portal no GitHub Actions, publica no
# GHCR (GitHub Container Registry, GRATIS) e cria/atualiza o Container App.
# Ter o portal tambem no Azure da a ele um host INDEPENDENTE da Guara.
#
# POR QUE GHCR E NAO ACR: o ACR Basic custa ~US$ 5/mes (conta o credito de
# estudante). O GHCR e gratis; como o repositorio e PUBLICO, o pacote tambem
# fica publico e o Container App puxa a imagem SEM credencial. Medido 04/10/2026.
#
# POR QUE O BUILD RODA AQUI (e nao na home-pc nem no proxy do Guara):
# o build pre-renderiza as paginas e PRECISA ler o banco (SSG). O Postgres do
# Guara e privado (`.svc.cluster.local`) — o CI nao o alcanca. O caminho que
# funciona e o `secrets.DATABASE_URL` (banco publico), o mesmo que o
# `pages.yml` ja usa. O proxy `guara proxy` foi testado e NAO serve: a sessao
# expira no meio do build (`4002 Invalid token`, medido 04/10/2026).
#
# SEM BANCO NO RUNTIME (decisao do dono, 04/10/2026): o app roda no Azure sem
# `DATABASE_URL`. O HTML das paginas ja sai pronto do build; as rotas
# dinamicas (busca, chat, APIs) ficam degradadas ate existir um Postgres no
# Azure. Este e o "espelho por enquanto".
#
# AUTH: OIDC (sem segredo de longa duracao). Variaveis do repositorio:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# O app de servico tem Contributor no grupo `cp-app`.
#
# Regiao: northcentralus. O Brasil NAO esta entre as regioes que a politica da
# assinatura de estudante libera (medido 04/10/2026) — o dado fica fora do pais.

name: Espelho no Azure (Container Apps)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  # Publicar imagem no GHCR exige `packages: write`.
  packages: write

concurrency:
  group: azure-mirror
  cancel-in-progress: true

env:
  GRUPO: cp-app
  APP: cp-web
  # Tag UNICA por build (SHA do commit). Com tag fixa (`:latest`), o
  # `az containerapp update --image` ve a MESMA string, nao cria revisao nova
  # e o container continua na imagem velha — foi o que escondeu o conserto do
  # New Relic por duas rodadas (medido 04/10/2026). Com SHA, toda rodada sobe
  # uma imagem distinta e o Container App repuxa.
  IMAGEM: ghcr.io/finweejur/controle-popular:${{ github.sha }}

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Entrar no Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # O build le o banco pelo `secrets.DATABASE_URL` (mesmo do pages.yml).
      # Sem o segredo, as paginas saem vazias — e o site sobe parecendo certo.
      - name: Construir e publicar a imagem (GHCR)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$IMAGEM" \
            --build-arg DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            .
          docker push "$IMAGEM"

      - name: Criar ou atualizar o Container App
        run: |
          if az containerapp show -g "$GRUPO" -n "$APP" -o none 2>/dev/null; then
            echo "Atualizando app existente"
            az containerapp update -g "$GRUPO" -n "$APP" --image "$IMAGEM" -o none
          else
            echo "Criando app"
            az containerapp create -g "$GRUPO" -n "$APP" \
              --environment cp-env \
              --image "$IMAGEM" \
              --target-port 3000 --ingress external \
              --min-replicas 0 --max-replicas 1 \
              --cpu 0.5 --memory 1.0Gi \
              -o none
          fi
          # New Relic (APM). So liga se a chave existir como secret do repo.
          # Fica guardada como SEGREDO do Container App e referenciada por
          # `secretref:` — nao vai em texto claro na configuracao do app. O
          # nome separado ("Azure") distingue este host do Guara no painel.
          if [ -n "${{ secrets.NEW_RELIC_LICENSE_KEY }}" ]; then
            echo "Ligando New Relic no espelho"
            az containerapp secret set -g "$GRUPO" -n "$APP" \
              --secrets "newrelic-key=${{ secrets.NEW_RELIC_LICENSE_KEY }}" -o none
            az containerapp update -g "$GRUPO" -n "$APP" \
              --set-env-vars \
                "NEW_RELIC_LICENSE_KEY=secretref:newrelic-key" \
                "NEW_RELIC_APP_NAME=Controle Popular (Azure)" \
              -o none
          else
            echo "NEW_RELIC_LICENSE_KEY ausente nos secrets — APM fica desligado."
          fi
          # Rele New Relic -> Telegram (/api/newrelic-alerta). So define se os
          # secrets existem; senao, PRESERVA o env ja configurado no app (foi
          # assim que destravamos: o segredo do repo estava vazio).
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "Configurando o rele de alertas (Telegram)"
            ARGS=("TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}")
            if [ -n "${{ secrets.NEWRELIC_RELAY_SECRET }}" ]; then
              ARGS+=("NEWRELIC_RELAY_SECRET=${{ secrets.NEWRELIC_RELAY_SECRET }}")
            fi
            # Token de Issues (PAT): com ele o rele tambem abre uma Issue no
            # GitHub. Sem o secret, so o Telegram avisa.
            if [ -n "${{ secrets.GITHUB_ISSUES_TOKEN }}" ]; then
              ARGS+=("GITHUB_ISSUES_TOKEN=${{ secrets.GITHUB_ISSUES_TOKEN }}")
            fi
            az containerapp update -g "$GRUPO" -n "$APP" --set-env-vars "${ARGS[@]}" -o none
          else
            echo "TELEGRAM_BOT_TOKEN/CHAT_ID ausentes nos secrets — preserva o env do app."
          fi
          # Leitura traduzida ("Ouvir" em outro idioma): Azure AI Translator +
          # Azure AI Speech. As chaves ficam como SEGREDOS do Container App
          # (secretref), nunca em texto claro. So liga se os secrets existirem
          # no repo; senao PRESERVA o env ja configurado e o cliente cai na voz
          # do navegador (degradacao honesta, /api/ouvir devolve 503).
          if [ -n "${{ secrets.AZURE_TRANSLATOR_KEY }}" ] && [ -n "${{ secrets.AZURE_SPEECH_KEY }}" ]; then
            echo "Ligando a leitura traduzida (Translator + Speech)"
            az containerapp secret set -g "$GRUPO" -n "$APP" \
              --secrets \
                "translator-key=${{ secrets.AZURE_TRANSLATOR_KEY }}" \
                "speech-key=${{ secrets.AZURE_SPEECH_KEY }}" -o none
            az containerapp update -g "$GRUPO" -n "$APP" \
              --set-env-vars \
                "AZURE_TRANSLATOR_KEY=secretref:translator-key" \
                "AZURE_TRANSLATOR_REGION=northcentralus" \
                "AZURE_SPEECH_KEY=secretref:speech-key" \
                "AZURE_SPEECH_REGION=northcentralus" \
              -o none
          else
            echo "Chaves de traducao/voz ausentes — leitura traduzida no fallback (voz do navegador)."
          fi

          # ═══ BANCO EM RUNTIME (dono, 06/10/2026) ═══
          # O espelho subia SEM `DATABASE_URL` e as paginas dinamicas — as que
          # chamam `unstable_noStore` e leem o Postgres a cada request, como
          # /ambiental/licenciamento — respondiam VAZIAS: medido naquele dia,
          # 0 linhas na pagina do espelho contra 2.094 no Guara. O banco
          # continua sendo o MESMO Postgres do Guara (`secrets.DATABASE_URL`, o
          # mesmo do build); o Azure so passa a alcancar o host publico.
          if [ -n "${{ secrets.DATABASE_URL }}" ]; then
            echo "Ligando o banco em runtime (Postgres do Guara)"
            az containerapp secret set -g "$GRUPO" -n "$APP" \
              --secrets "db-url=${{ secrets.DATABASE_URL }}" -o none
            az containerapp update -g "$GRUPO" -n "$APP" \
              --set-env-vars "DATABASE_URL=secretref:db-url" -o none
          else
            echo "DATABASE_URL ausente nos secrets — paginas dinamicas ficam vazias."
          fi

          # ═══ DOMINIO PRINCIPAL NO AZURE (dono, 06/10/2026) ═══
          # O `www.controlepopular.com.br` passa a ser servido aqui (o `.tech` vai
          # para o Guara). A ORDEM importa e evita janela sem HTTPS:
          #   1. `hostname add` cria o hostname e devolve o TXT de validacao;
          #   2. o TXT `asuid.<host>` e publicado na Cloudflare (DNS apenas);
          #   3. o `bind --validation-method TXT` emite o certificado
          #      gerenciado ENQUANTO o CNAME ainda aponta para o Guara — o
          #      site segue no ar, sem erro de TLS;
          #   4. so entao `trocar-dominios.yml` move o CNAME.
          # Sem a Cloudflare (token ausente) o passo avisa e segue: ai a
          # validacao cai no CNAME e o certificado so sai depois da troca.
          DOMINIO_EXTRA="${{ vars.AZURE_CUSTOM_DOMAIN || 'www.controlepopular.com.br' }}"
          ZONA_EXTRA="${DOMINIO_EXTRA#*.}"
          CF="${{ secrets.CLOUDFLARE_API_TOKEN }}"
          if [ -n "$DOMINIO_EXTRA" ]; then
            echo "Preparando o dominio $DOMINIO_EXTRA neste app"
            az containerapp hostname add -g "$GRUPO" -n "$APP" \
              --hostname "$DOMINIO_EXTRA" -o none 2>/dev/null || true

            TOKEN=$(az containerapp hostname list -g "$GRUPO" -n "$APP" \
              --query "[?name=='$DOMINIO_EXTRA'].validationToken | [0]" -o tsv 2>/dev/null || true)
            if [ -n "$TOKEN" ] && [ -n "$CF" ]; then
              api="https://api.cloudflare.com/client/v4"
              ZID=$(curl -s -H "Authorization: Bearer $CF" "$api/zones?name=$ZONA_EXTRA" \
                | jq -r '.result[0].id // empty')
              if [ -n "$ZID" ]; then
                NOME_TXT="asuid.$DOMINIO_EXTRA"
                RID=$(curl -s -H "Authorization: Bearer $CF" \
                  "$api/zones/$ZID/dns_records?name=$NOME_TXT" | jq -r '.result[0].id // empty')
                CORPO="{\"type\":\"TXT\",\"name\":\"$NOME_TXT\",\"content\":\"$TOKEN\",\"ttl\":120}"
                if [ -n "$RID" ]; then
                  curl -s -X PATCH -H "Authorization: Bearer $CF" -H "Content-Type: application/json" \
                    "$api/zones/$ZID/dns_records/$RID" --data "$CORPO" > /dev/null
                else
                  curl -s -X POST -H "Authorization: Bearer $CF" -H "Content-Type: application/json" \
                    "$api/zones/$ZID/dns_records" --data "$CORPO" > /dev/null
                fi
                echo "TXT de validacao ($NOME_TXT) publicado na Cloudflare"
              fi
            fi

            if [ -n "$TOKEN" ]; then
              az containerapp hostname bind -g "$GRUPO" -n "$APP" \
                --hostname "$DOMINIO_EXTRA" --environment cp-env \
                --validation-method TXT -o none \
                || echo "AVISO: bind por TXT nao concluiu (tenta de novo na proxima rodada)."
            else
              az containerapp hostname bind -g "$GRUPO" -n "$APP" \
                --hostname "$DOMINIO_EXTRA" --environment cp-env \
                --validation-method CNAME -o none \
                || echo "AVISO: certificado ainda nao emitido (o DNS precisa apontar para este app)."
            fi
          fi

          FQDN=$(az containerapp show -g "$GRUPO" -n "$APP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "Espelho no ar em: https://$FQDN"
