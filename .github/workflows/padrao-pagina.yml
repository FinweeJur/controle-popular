name: Padrao pagina

# Confere o padrao wiki das 100 rotas do catalogo (top-100-paginas.json).
# Checker estatico em Python puro: le arquivo do disco, sem browser e sem
# banco. Catraca desde 14/10/2026: falha (exit 1) so quando uma rota PIORA
# contra a regua gravada em docs/relatorios-automacao/padrao-catraca.json
# (dívida ja registrada — 97 paginas parciais — nao trava commit alheio).
# Subir a régua apos consertar paginas: python scripts/verificar-padrao-pagina.py
# --gravar-catraca docs/relatorios-automacao/padrao-catraca.json
# Segundo porteiro (D1, 15/10/2026): data de coleta visivel nas rotas de dado
# do registry (PLANO-DATA-DO-DADO.md). Regua propria:
# docs/relatorios-automacao/padrao-catraca-datas.json; subir a régua com
# python scripts/checar-data-coleta.py --gravar-catraca <mesmo caminho>.

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "scripts/verificar-padrao-pagina.py"
      - "scripts/checar-data-coleta.py"
      - ".github/workflows/padrao-pagina.yml"
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar padrao das paginas do top 100 (catraca)
        run: python scripts/verificar-padrao-pagina.py --catraca docs/relatorios-automacao/padrao-catraca.json
      - name: Porteiro D1 - data de coleta visivel nas rotas do registry (catraca)
        run: python scripts/checar-data-coleta.py --catraca docs/relatorios-automacao/padrao-catraca-datas.json
