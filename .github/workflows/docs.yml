name: Documentacao

# Garante que toda alteracao em docs/ e no proprio validador mantenha o
# template, os links internos e as palavras-chave. Leve e sem dependencia de
# banco ou de Node.

on:
  push:
    paths:
      - "docs/**"
      - "scripts/validar-documentacao.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "scripts/validar-documentacao.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar estrutura da documentacao
        run: python scripts/validar-documentacao.py
