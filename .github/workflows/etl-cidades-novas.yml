# ETL de Belo Horizonte (3106200) e São Paulo (3550308).
#
# POR QUE UM ARQUIVO SEPARADO DE `etl-betim.yml`. As três cidades compartilham
# a maior parte dos módulos, mas divergem justamente nos mais pesados:
#
#   contratos   Betim e SP -> PNCP        BH -> GRP da PBH (etl.pbh.contratos)
#   câmara      etl.camaras.betim         etl.camaras.bh / etl.camaras.sp
#   servidores  etl.prefeitura.b3106705   etl.pbh.folha / etl.psp.servidores
#   crimes      Sejusp-MG                 SP -> API da SSP-SP (etl.psp.crimes)
#
# Uma matriz sobre `etl-betim.yml` exigiria um `if:` por cidade em quase todo
# passo, e o arquivo já tem 13 KB. Dois jobs explícitos aqui são mais longos e
# muito mais legíveis — e, sobretudo, mexer neles não pode quebrar o cron de
# Betim, que é o único que hoje serve gente.
#
# CADÊNCIA. Mais espaçada que a de Betim de propósito: o volume é 5-6x maior
# (SP tem 125 mil servidores, BH tem 6.838 contratos) e cada rodada dessas
# custa egress no plano free do Neon — o mesmo teto de 5 GB/mês que já limita
# `rebuild.yml` a um build semanal.
name: ETL cidades novas (BH e SP)

on:
  schedule:
    # Terça 09:00 UTC — depois do de Betim (segunda), para não disputar o
    # PNCP, que devolve 429 com facilidade quando dois jobs varrem juntos.
    - cron: "0 9 * * 2"
    # Mensal: os módulos caros (folha de SP, varredura de CNPJs de órgão).
    - cron: "0 10 2 * *"
  workflow_dispatch:

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  TRANSPARENCIA_API_KEY: ${{ secrets.TRANSPARENCIA_API_KEY }}

jobs:
  belo-horizonte:
    runs-on: ubuntu-latest
    # Desligado por agendamento em 2026-08-10, pela mesma razão detalhada em
    # `etl-betim.yml`: o banco é o Postgres da máquina de build e o runner do
    # GitHub não o alcança. O `schedule:` acima FICA porque
    # `scripts/rotina-local.mts` lê estes crons como cadência da rotina local.
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 180
    defaults:
      run:
        working-directory: etl/betim
    env:
      ID_MUNICIPIO: "3106200"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -r requirements.txt

      # O guarda que impede a volta do defeito de 2026-08-03: default de
      # argparse amarrado a uma cidade fazia o ETL de uma coletar o dado de
      # outra e reetiquetá-lo, sem erro. Falha o job antes de gravar nada.
      - name: Conferir que nenhum módulo carrega cidade por dentro
        run: python scripts/conferir_defaults_de_cidade.py

      # ── Semanal ──────────────────────────────────────────────────────
      # O GRP é a fonte canônica de contrato em BH; `etl.pncp.contratos`
      # ABORTA nesta cidade de propósito (fontes.contratos_fonte=grp_pbh),
      # porque rodar os dois já produziu 745 duplicatas exatas.
      - name: "PBH — contratos e licitações (GRP)"
        run: python -m etl.pbh.contratos --id-municipio $ID_MUNICIPIO

      - name: "Câmara — vereadores, proposições, subsídio, custeio"
        run: python -m etl.camaras.bh --id-municipio $ID_MUNICIPIO

      - name: "Convênios federais"
        run: python -m etl.apis.transparencia_gov --id-municipio $ID_MUNICIPIO

      - name: "Fornecedores sancionados (CEIS/CNEP)"
        run: python -m etl.apis.ceis_cnep --id-municipio $ID_MUNICIPIO

      - name: "Benefícios sociais"
        run: python -m etl.apis.beneficios_sociais --id-municipio $ID_MUNICIPIO

      - name: "Crimes violentos (Sejusp-MG)"
        run: python -m etl.apis.crimes_mg --id-municipio $ID_MUNICIPIO

      - name: "Postos de combustível (ANP)"
        run: python -m etl.apis.anp --id-municipio $ID_MUNICIPIO

      - name: "Clima"
        run: python -m etl.apis.openmeteo --id-municipio $ID_MUNICIPIO

      - name: "InfoDengue"
        run: python -m etl.apis.infodengue --id-municipio $ID_MUNICIPIO

      - name: "Temas e alertas"
        run: |
          python -m etl.temas_backfill --id-municipio $ID_MUNICIPIO
          python -m etl.alertas --id-municipio $ID_MUNICIPIO

      # 2026-08-09: a camada agnóstica de cidade (Base dos Dados + PNTP +
      # grupos econômicos) nunca tinha entrado aqui, só em etl-betim.yml —
      # confirmado por grep, zero ocorrência. Cadência espelha a de Betim
      # (cnpj/grupos são semanais lá, o resto do bd.* é mensal).
      # `teor_backfill` fica de fora de propósito: no próprio Betim ele
      # ainda é só workflow_dispatch (passo novo de 2026-08-09), então
      # replicar aqui seria automatizar mais do que a cidade de origem tem.
      - name: "CNPJ — fornecedores/sócios (Base dos Dados)"
        run: python -m etl.bd.cnpj --id-municipio $ID_MUNICIPIO

      - name: "Grupos econômicos"
        run: python -m etl.grupos --id-municipio $ID_MUNICIPIO

      # ── Mensal ───────────────────────────────────────────────────────
      - name: "PBH — folha de pagamento (mensal)"
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 2 * *'
        run: python -m etl.pbh.folha --id-municipio $ID_MUNICIPIO --meses 3

      - name: "BD SICONFI — despesas/receitas (mensal)"
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 2 * *'
        run: python -m etl.bd.siconfi --id-municipio $ID_MUNICIPIO

      - name: "BD IBGE — população/PIB (mensal)"
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 2 * *'
        run: python -m etl.bd.ibge --id-municipio $ID_MUNICIPIO

      - name: "BD INEP — IDEB/censo escolar (mensal)"
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 2 * *'
        run: python -m etl.bd.inep --id-municipio $ID_MUNICIPIO

      - name: "BD CNES — estabelecimentos de saúde (mensal)"
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 2 * *'
        run: python -m etl.bd.cnes --id-municipio $ID_MUNICIPIO

      - name: "BD SIH/SIM — internações/mortalidade (mensal)"
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 2 * *'
        run: python -m etl.bd.sih_sim --id-municipio $ID_MUNICIPIO

      - name: "BD SNIS — água/esgoto/resíduos (mensal)"
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 2 * *'
        run: python -m etl.bd.snis --id-municipio $ID_MUNICIPIO

      - name: "BD RAIS/CAGED — trabalho (mensal)"
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 2 * *'
        run: python -m etl.bd.trabalho --id-municipio $ID_MUNICIPIO

      - name: "BD IBGE PAM/PPM — produção agropecuária (mensal)"
        # Depende da migration 0016_producao_agropecuaria.sql, mesma nota
        # de etl-betim.yml — falha graciosamente até rodar, não bloqueia.
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 2 * *'
        continue-on-error: true
        run: python -m etl.bd.agropecuaria --id-municipio $ID_MUNICIPIO

      - name: "BD SICONFI — caixa disponível / balanço patrimonial (mensal)"
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 2 * *'
        run: python -m etl.bd.balanco --id-municipio $ID_MUNICIPIO

      - name: "BD DENATRAN — frota de veículos (mensal)"
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 2 * *'
        run: python -m etl.bd.frota --id-municipio $ID_MUNICIPIO

      - name: "BD PNUD/ADH — IDH e taxa de pobreza (mensal)"
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 2 * *'
        run: python -m etl.bd.idh_pobreza --id-municipio $ID_MUNICIPIO

      - name: "Nota de Transparência (PNTP/ATRICON) (mensal)"
        # Depende da migration 0018_nota_transparencia.sql, mesma nota de
        # etl-betim.yml — falha graciosamente até rodar, não bloqueia.
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 2 * *'
        continue-on-error: true
        run: python -m etl.apis.pntp --id-municipio $ID_MUNICIPIO

  sao-paulo:
    runs-on: ubuntu-latest
    # Ver a nota no job `belo-horizonte` acima.
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 180
    defaults:
      run:
        working-directory: etl/betim
    env:
      ID_MUNICIPIO: "3550308"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Conferir que nenhum módulo carrega cidade por dentro
        run: python scripts/conferir_defaults_de_cidade.py

      # ── Semanal ──────────────────────────────────────────────────────
      # Depende de `municipios.fontes.cnpjs_orgao`, populado pela varredura
      # mensal abaixo. Sem a lista, o módulo cai no CNPJ da prefeitura e
      # AVISA — em São Paulo isso são 114 contratos em vez de milhares.
      - name: "PNCP — contratos e licitações"
        run: |
          python -m etl.pncp.contratos --id-municipio $ID_MUNICIPIO --ano-inicio 2024
          python -m etl.pncp.licitacoes --id-municipio $ID_MUNICIPIO --ano-inicio 2024

      - name: "Câmara — vereadores, proposições, verba de gabinete"
        run: python -m etl.camaras.sp --id-municipio $ID_MUNICIPIO

      - name: "Criminalidade (SSP-SP)"
        run: python -m etl.psp.crimes --id-municipio $ID_MUNICIPIO

      - name: "Convênios federais"
        run: python -m etl.apis.transparencia_gov --id-municipio $ID_MUNICIPIO

      - name: "Fornecedores sancionados (CEIS/CNEP)"
        run: python -m etl.apis.ceis_cnep --id-municipio $ID_MUNICIPIO

      - name: "Benefícios sociais"
        run: python -m etl.apis.beneficios_sociais --id-municipio $ID_MUNICIPIO

      - name: "Postos de combustível (ANP)"
        run: python -m etl.apis.anp --id-municipio $ID_MUNICIPIO

      - name: "Clima"
        run: python -m etl.apis.openmeteo --id-municipio $ID_MUNICIPIO

      - name: "InfoDengue"
        run: python -m etl.apis.infodengue --id-municipio $ID_MUNICIPIO

      - name: "Temas e alertas"
        run: |
          python -m etl.temas_backfill --id-municipio $ID_MUNICIPIO
          python -m etl.alertas --id-municipio $ID_MUNICIPIO

      # 2026-08-09: camada agnóstica de cidade (Base dos Dados + PNTP +
      # grupos econômicos), mesma nota do job de belo-horizonte acima.
      - name: "CNPJ — fornecedores/sócios (Base dos Dados)"
        run: python -m etl.bd.cnpj --id-municipio $ID_MUNICIPIO

      - name: "Grupos econômicos"
        run: python -m etl.grupos --id-municipio $ID_MUNICIPIO

      # ── Mensal ───────────────────────────────────────────────────────
      # Órgão municipal novo é raro e a varredura é cara (o PNCP devolve 429
      # com facilidade), então mensal — mas ela PRECISA rodar: é o que impede
      # o portal de mostrar 114 contratos para uma cidade de 12 milhões.
      - name: "PNCP — redescobrir CNPJs de órgão (mensal)"
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 2 * *'
        run: python -m etl.pncp.orgaos --id-municipio $ID_MUNICIPIO --gravar

      - name: "SEGES — servidores e folha (mensal)"
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 2 * *'
        run: python -m etl.psp.servidores --id-municipio $ID_MUNICIPIO --meses 3

      - name: "BD SICONFI — despesas/receitas (mensal)"
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 2 * *'
        run: python -m etl.bd.siconfi --id-municipio $ID_MUNICIPIO

      - name: "BD IBGE — população/PIB (mensal)"
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 2 * *'
        run: python -m etl.bd.ibge --id-municipio $ID_MUNICIPIO

      - name: "BD INEP — IDEB/censo escolar (mensal)"
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 2 * *'
        run: python -m etl.bd.inep --id-municipio $ID_MUNICIPIO

      - name: "BD CNES — estabelecimentos de saúde (mensal)"
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 2 * *'
        run: python -m etl.bd.cnes --id-municipio $ID_MUNICIPIO

      - name: "BD SIH/SIM — internações/mortalidade (mensal)"
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 2 * *'
        run: python -m etl.bd.sih_sim --id-municipio $ID_MUNICIPIO

      - name: "BD SNIS — água/esgoto/resíduos (mensal)"
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 2 * *'
        run: python -m etl.bd.snis --id-municipio $ID_MUNICIPIO

      - name: "BD RAIS/CAGED — trabalho (mensal)"
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 2 * *'
        run: python -m etl.bd.trabalho --id-municipio $ID_MUNICIPIO

      - name: "BD IBGE PAM/PPM — produção agropecuária (mensal)"
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 2 * *'
        continue-on-error: true
        run: python -m etl.bd.agropecuaria --id-municipio $ID_MUNICIPIO

      - name: "BD SICONFI — caixa disponível / balanço patrimonial (mensal)"
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 2 * *'
        run: python -m etl.bd.balanco --id-municipio $ID_MUNICIPIO

      - name: "BD DENATRAN — frota de veículos (mensal)"
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 2 * *'
        run: python -m etl.bd.frota --id-municipio $ID_MUNICIPIO

      - name: "BD PNUD/ADH — IDH e taxa de pobreza (mensal)"
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 2 * *'
        run: python -m etl.bd.idh_pobreza --id-municipio $ID_MUNICIPIO

      - name: "Nota de Transparência (PNTP/ATRICON) (mensal)"
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 2 * *'
        continue-on-error: true
        run: python -m etl.apis.pntp --id-municipio $ID_MUNICIPIO
